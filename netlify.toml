[dev]
  command = "pnpm dev"
  framework = "astro"

[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions/"

# ✅ Permitir la página de mantenimiento
[[redirects]]
  from = "/mantenimiento"
  to = "/mantenimiento"
  status = 200

# 🚧 Redirigir todo lo demás
[[redirects]]
  from = "/*"
  to = "/mantenimiento"
  status = 302
  force = true
