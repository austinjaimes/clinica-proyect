[dev]
  command = "pnpm dev"
  framework = "astro"

[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions/"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://youtube-nocookie.com https://www.youtube-nocookie.com; style-src 'self' 'unsafe-inline'; frame-src https://youtube-nocookie.com https://www.youtube-nocookie.com; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "DENY"
